<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSC CGL Tracker 2027</title>
<style>body{margin:0;background:#0b1220;color:#eef2ff;font:15px Arial}*{box-sizing:border-box}.app{display:flex;min-height:100vh}aside{width:220px;background:#111a2d;padding:18px}.brand{font-size:21px;font-weight:800;margin:6px}.brand span{color:#8ba5ff}nav button{width:100%;padding:10px;margin:3px 0;background:transparent;border:0;color:#aeb9d3;text-align:left;border-radius:8px}nav button.active,nav button:hover{background:#233455;color:white}main{flex:1;padding:24px;max-width:1400px;margin:auto}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.3fr 1fr}.card{background:#121f35;border:1px solid #2b3d60;border-radius:13px;padding:16px}.big{font-size:28px;font-weight:800}.muted{color:#95a6c5}.bar{height:8px;background:#263650;border-radius:9px}.bar i{display:block;height:100%;background:#8ba5ff;border-radius:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #243653}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #243653;text-align:left}th{color:#95a6c5}select,input{background:#0b1628;color:white;border:1px solid #344a70;padding:8px;border-radius:8px;width:100%}.btn{background:#8ba5ff;color:#08101d;border:0;padding:9px 13px;border-radius:8px;font-weight:700}.badge{padding:4px 7px;border-radius:99px;background:#203252;font-size:12px}.good{color:#6fe0a4}.warn{color:#ffd36e}.bad{color:#ff8797}.heat{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}.day{aspect-ratio:1;background:#17243a;border-radius:3px}.l1{background:#39547d}.l2{background:#5775aa}.l3{background:#7694d7}.l4{background:#a5bdff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal{min-height:70px;border:1px solid #2a3d60;border-radius:8px;padding:6px}.event{font-size:10px;padding:4px;margin-top:4px;background:#233757;border-radius:4px}.event.m{background:#4a3d20}.event.o{background:#482431}@media(max-width:850px){.app{display:block}aside{width:auto}nav{display:grid;grid-template-columns:repeat(2,1fr)}.cards,.two{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}main{padding:14px}}</style></head>
<body><div class="app"><aside><div class="brand">SSC CGL <span>2027</span></div><nav id="nav"></nav></aside><main><div id="page"></div></main></div>
<script>
const S = {
  Quant: ["Number System","Percentage","Ratio & Proportion","Average","Profit & Loss","Simple & Compound Interest","Time & Work","Time, Speed & Distance","Algebra","Geometry","Mensuration","Trigonometry","Data Interpretation"],
  English: ["Noun","Pronoun","Verb","Adjective","Adverb","Articles","Prepositions","Tenses","Voice","Narration","Error Detection","Synonyms & Antonyms","One Word Substitution","Idioms & Phrases","Cloze Test","Reading Comprehension"],
  Reasoning: ["Analogy","Classification","Series","Coding-Decoding","Blood Relations","Direction Sense","Venn Diagrams","Syllogism","Statement & Conclusion","Ranking","Non-Verbal Reasoning","Mirror & Water Image","Paper Folding","Embedded Figures"],
  GA: ["Ancient History","Medieval History","Modern History","Indian Polity","Geography","Economics","General Science","Physics","Chemistry","Biology","Static GK","Current Affairs"]
};
function makeTopics(){return Object.keys(S).flatMap(function(s){return S[s].map(function(topic){return {id:s+"|"+topic,s:s,topic:topic,status:"Not started",studied:null,weekly:null,monthly:null,weeklyDone:false,monthlyDone:false,acc:null};});});}
let db;
try{db=JSON.parse(localStorage.getItem("cgl2027")||"null");}catch(e){db=null;}
if(!db || !Array.isArray(db.topics)){db={topics:makeTopics(),study:[],mocks:[],settings:{hours:8}};}
if(!db.study)db.study=[]; if(!db.mocks)db.mocks=[]; if(!db.settings)db.settings={hours:8};
function save(){localStorage.setItem("cgl2027",JSON.stringify(db));}
function today(){return new Date().toISOString().slice(0,10);}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function nextSunday(s){var d=new Date(s+"T12:00:00"),n=(7-d.getDay())%7;if(n===0)n=7;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch];});}
function totalTopics(){return db.topics.length;}
function completedTopics(){return db.topics.filter(function(x){return x.status==="Completed";}).length;}
function syllabusPct(){return Math.round(completedTopics()/totalTopics()*100);}
function totalMinutes(){return db.study.reduce(function(a,x){return a+Number(x.minutes||0);},0);}
function mockUnlocked(){return syllabusPct()>=50;}
function revisions(){var t=today(),a=[];db.topics.forEach(function(x){if(x.weekly&&!x.weeklyDone)a.push({x:x,type:"Weekly",date:x.weekly,over:x.weekly<=t});if(x.monthly&&!x.monthlyDone)a.push({x:x,type:"Monthly",date:x.monthly,over:x.monthly<=t});});return a.sort(function(a,b){return a.date.localeCompare(b.date);});}
function readiness(){var a=db.topics.filter(function(x){return x.acc!=null;}),avg=a.length?a.reduce(function(s,x){return s+Number(x.acc);},0)/a.length:0,h=Math.min(totalMinutes()/30000,1),c=Math.min(db.study.filter(function(x){return Number(x.minutes||0)>=60;}).length/90,1),m=Math.min(db.mocks.length/30,1);return Math.round(syllabusPct()*.35+h*15+(avg/100)*25+m*15+c*10);}
function heat(){var out="";for(var i=139;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var day=d.toISOString().slice(0,10),m=db.study.filter(function(x){return x.date===day;}).reduce(function(a,x){return a+Number(x.minutes||0);},0),l=m>=480?4:m>=240?3:m>=60?2:m?1:0;out+="<div class='day l"+l+"' title='"+day+"'></div>";}return out;}
var labels={dashboard:"🏠 Dashboard",planner:"🗓️ Planner",syllabus:"📚 Syllabus",study:"⏱️ Study Log",revision:"🔁 Revision",pyq:"📝 PYQ",mocks:"🎯 Mocks",analytics:"📊 Analytics",backup:"💾 Backup"};
nav.innerHTML=Object.keys(labels).map(function(k){return "<button data-p="+k+">"+labels[k]+"</button>";}).join("");
nav.addEventListener("click",function(e){if(e.target.dataset.p)location.hash=e.target.dataset.p;});
window.addEventListener("hashchange",render);

function render(){var p=location.hash.slice(1)||"dashboard";document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("active",b.dataset.p===p);});var fn={dashboard:dashboard,planner:planner,syllabus:syllabus,study:study,revision:revision,pyq:pyq,mocks:mocks,analytics:analytics,backup:backup}[p]||dashboard;fn(page);}

function dashboard(p){
  var r=revisions(),w=db.topics.filter(function(x){return x.acc!=null&&x.acc<70;}).sort(function(a,b){return a.acc-b.acc;}).slice(0,5);
  p.innerHTML="<h1>SSC CGL Tracker 2027</h1><p class=muted>8 hours/day • Sunday weekly revision • full mocks after 50%</p>"+
  "<div class='grid cards'><div class=card><div class=muted>READINESS</div><div class=big>"+readiness()+"%</div><div class=bar><i style='width:"+readiness()+"%'></i></div></div>"+
  "<div class=card><div class=muted>SYLLABUS</div><div class=big>"+syllabusPct()+"%</div><div class=muted>"+completedTopics()+"/"+totalTopics()+" topics</div></div>"+
  "<div class=card><div class=muted>STUDY HOURS</div><div class=big>"+Math.round(totalMinutes()/60)+"</div><div class=muted>total logged</div></div>"+
  "<div class=card><div class=muted>REVISION QUEUE</div><div class=big>"+r.length+"</div><div class=muted>"+r.filter(function(x){return x.over;}).length+" overdue</div></div></div>"+
  "<div class='grid two' style='margin-top:14px'><div class=card><h2>⚠️ Weak Topics</h2>"+(w.length?"<table><tr><th>Subject</th><th>Topic</th><th>Accuracy</th></tr>"+w.map(function(x){return "<tr><td>"+x.s+"</td><td>"+esc(x.topic)+"</td><td class=bad>"+x.acc+"%</td></tr>";}).join("")+"</table>":"<div class=muted>Log PYQ accuracy to detect weak chapters.</div>")+
  "</div><div class=card><h2>🔁 Next Revision</h2>"+(r.slice(0,7).map(function(x){return "<div class=row><span>"+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.type+"</span></div>";}).join("")||"<div class=good>Revision queue clear.</div>")+"</div></div>"+
  "<div class=card style='margin-top:14px'><h2>🔥 Consistency</h2><div class=heat>"+heat()+"</div></div>";
}
function planner(p){
  var due=revisions().filter(function(x){return x.date<=today();}),sunday=new Date().getDay()===0;
  p.innerHTML="<h1>Daily Planner</h1><p class=muted>"+(sunday?"🔁 Sunday Revision Day":"📚 Study + Practice Day")+" • target "+db.settings.hours+" hours</p>"+
  "<div class='grid two'><div class=card><h2>Priority order</h2><p>1. Overdue revisions</p><p>2. Today's weekly/monthly revisions</p><p>3. Weak chapters below 70%</p><p>4. New syllabus</p><p>"+(mockUnlocked()?"<span class=good>🎯 Full mocks unlocked.</span>":"<span class=warn>🔒 Full mocks unlock at 50% syllabus.</span>")+"</p></div>"+
  "<div class=card><h2>Quick Study Log</h2><form id=quickForm><select name=subject>"+Object.keys(S).map(function(s){return "<option>"+s+"</option>";}).join("")+"</select><input name=minutes type=number min=1 placeholder='Minutes' required><input name=topic placeholder='Topic'><button class=btn type=submit>Log Study</button></form></div></div>"+
  "<div class=card style='margin-top:14px'><h2>Due / Overdue</h2>"+(due.map(function(x){return "<div class=row><span><b>"+x.x.s+"</b> • "+esc(x.x.topic)+" <span class=badge>"+x.type+"</span></span><button class='btn doneRev' data-id="+encodeURIComponent(x.x.id)+" data-type="+x.type+">Done</button></div>";}).join("")||"<div class=good>Nothing due today.</div>")+"</div>";
  document.getElementById("quickForm").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target);db.study.push({date:today(),subject:f.get("subject"),minutes:f.get("minutes"),topic:f.get("topic")});save();render();});
  p.querySelectorAll(".doneRev").forEach(function(b){b.addEventListener("click",function(){var x=db.topics.find(function(t){return t.id===decodeURIComponent(b.dataset.id);});if(x){if(b.dataset.type==="Weekly")x.weeklyDone=true;else x.monthlyDone=true;save();render();}});});
}
function syllabus(p){
  p.innerHTML="<h1>Syllabus</h1><p class=muted>Complete a topic → weekly review on the next Sunday + monthly review 30 days later.</p><div class=card><table><tr><th>Subject</th><th>Topic</th><th>Status</th><th>Weekly</th><th>Monthly</th><th>PYQ</th></tr>"+
  db.topics.map(function(x,i){return "<tr><td>"+x.s+"</td><td>"+esc(x.topic)+"</td><td><select class=status data-i="+i+"><option>Not started</option><option>Learning</option><option>Completed</option></select></td><td>"+(x.weeklyDone?"✅ ":"")+(x.weekly||"—")+"</td><td>"+(x.monthlyDone?"✅ ":"")+(x.monthly||"—")+"</td><td>"+(x.acc==null?"—":x.acc+"%")+"</td></tr>";}).join("")+"</table></div>";
  p.querySelectorAll(".status").forEach(function(s){var i=Number(s.dataset.i);s.value=db.topics[i].status;s.addEventListener("change",function(){var x=db.topics[i],old=x.status;x.status=s.value;if(s.value==="Completed"&&old!=="Completed"){x.studied=today();x.weekly=nextSunday(x.studied);x.monthly=addDays(x.studied,30);x.weeklyDone=false;x.monthlyDone=false;}save();render();});});
}
function study(p){
  p.innerHTML="<h1>Study Log</h1><div class=card><form id=studyForm><input name=date type=date value="+today()+" required><select name=subject>"+Object.keys(S).map(function(s){return "<option>"+s+"</option>";}).join("")+"</select><input name=minutes type=number min=1 placeholder='Minutes' required><input name=topic placeholder='Topic'><button class=btn>Add Study</button></form></div>"+
  "<div class=card style='margin-top:14px'><table><tr><th>Date</th><th>Subject</th><th>Topic</th><th>Minutes</th></tr>"+db.study.slice().reverse().map(function(x){return "<tr><td>"+x.date+"</td><td>"+x.subject+"</td><td>"+esc(x.topic)+"</td><td>"+x.minutes+"</td></tr>";}).join("")+"</table></div>";
  document.getElementById("studyForm").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target);db.study.push({date:f.get("date"),subject:f.get("subject"),minutes:f.get("minutes"),topic:f.get("topic")});save();render();});
}
function revision(p){
  var r=revisions();
  p.innerHTML="<h1>Revision Center</h1><p class=muted>Weekly revision is scheduled for Sundays. Overdue items remain until completed.</p><div class='grid two'><div class=card><h2>🔁 Weekly</h2>"+
  (r.filter(function(x){return x.type==="Weekly";}).map(function(x){return "<div class=row><span>"+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.date+"</span></div>";}).join("")||"<div class=muted>No weekly revisions.</div>")+
  "</div><div class=card><h2>📅 Monthly</h2>"+(r.filter(function(x){return x.type==="Monthly";}).map(function(x){return "<div class=row><span>"+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.date+"</span></div>";}).join("")||"<div class=muted>No monthly revisions.</div>")+
  "</div></div><div class=card style='margin-top:14px'><h2>Revision calendar</h2><div class=calendar>"+calendarHtml()+"</div></div>";
}
function calendarHtml(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),out="";
  for(var i=0;i<new Date(y,m,1).getDay();i++)out+="<div class=cal></div>";
  for(var day=1;day<=n;day++){var s=new Date(y,m,day,12).toISOString().slice(0,10),ev=revisions().filter(function(x){return x.date===s;});out+="<div class=cal><small>"+day+"</small>"+ev.map(function(x){return "<div class='event "+(x.type==="Monthly"?"m ":"")+(x.over?"o":"")+"'>"+x.type+" • "+esc(x.x.topic)+"</div>";}).join("")+"</div>";}
  return out;
}
function pyq(p){
  p.innerHTML="<h1>PYQ Tracker</h1><p class=muted>Enter your latest accuracy for a chapter.</p><div class=card><form id=pyqForm><select name=subject>"+Object.keys(S).map(function(s){return "<option>"+s+"</option>";}).join("")+"</select><select name=topic>"+Object.values(S).flat().map(function(t){return "<option>"+esc(t)+"</option>";}).join("")+"</select><input name=accuracy type=number min=0 max=100 placeholder='Accuracy %' required><button class=btn>Save Accuracy</button></form></div>"+
  "<div class=card style='margin-top:14px'><table><tr><th>Subject</th><th>Topic</th><th>Accuracy</th></tr>"+db.topics.filter(function(x){return x.acc!=null;}).sort(function(a,b){return a.acc-b.acc;}).map(function(x){return "<tr><td>"+x.s+"</td><td>"+esc(x.topic)+"</td><td class="+(x.acc<70?"bad":x.acc<85?"warn":"good")+">"+x.acc+"%</td></tr>";}).join("")+"</table></div>";
  document.getElementById("pyqForm").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target),x=db.topics.find(function(t){return t.s===f.get("subject")&&t.topic===f.get("topic");});if(x)x.acc=Number(f.get("accuracy"));save();render();});
}
function mocks(p){
  var ok=mockUnlocked();
  p.innerHTML="<h1>Mock Tests</h1><div class=badge>"+(ok?"🎯 50% syllabus reached — full mocks enabled":"🔒 Full mocks unlock after 50% syllabus completion")+"</div>"+
  (ok?"<div class=card style='margin-top:12px'><form id=mockForm><input name=date type=date value="+today()+" required><input name=name placeholder='Mock name' required><input name=score type=number placeholder='Score' required><input name=total type=number value=200><button class=btn>Add Mock</button></form></div>":"")+
  "<div class=card style='margin-top:12px'><table><tr><th>Date</th><th>Mock</th><th>Score</th><th>%</th></tr>"+db.mocks.slice().reverse().map(function(x){return "<tr><td>"+x.date+"</td><td>"+esc(x.name)+"</td><td>"+x.score+"/"+x.total+"</td><td>"+Math.round(x.score/x.total*100)+"%</td></tr>";}).join("")+"</table></div>";
  if(ok)document.getElementById("mockForm").addEventListener("submit",function(e){e.preventDefault();var f=new FormData(e.target);db.mocks.push({date:f.get("date"),name:f.get("name"),score:f.get("score"),total:f.get("total")});save();render();});
}
function analytics(p){
  p.innerHTML="<h1>Analytics</h1><div class='grid cards'>"+Object.keys(S).map(function(s){var a=db.topics.filter(function(x){return x.s===s&&x.acc!=null;}).map(function(x){return Number(x.acc);}),v=a.length?Math.round(a.reduce(function(u,z){return u+z;},0)/a.length):0;return "<div class=card><div class=muted>"+s+"</div><div class=big>"+(v||"—")+(v?"%":"")+"</div><div class=bar><i style='width:"+v+"%'></i></div></div>";}).join("")+"</div>"+
  "<div class=card style='margin-top:14px'><p>🔴 Weak: below 70% • 🟡 Needs work: 70–84% • 🟢 Strong: 85%+</p><p>🎯 Full mocks: after 50% syllabus completion.</p></div>";
}
function backup(p){
  p.innerHTML="<h1>Backup & Settings</h1><div class=card><p class=muted>No paid cloud database. Your tracker lives in this browser.</p><button id=export class=btn>Export JSON Backup</button><input id=import type=file accept=.json><button id=restore class=btn>Restore Backup</button><p><label>Daily target hours <input id=hours type=number min=1 max=24 value="+db.settings.hours+"></label><button id=saveHours class=btn>Save</button></p></div>";
  document.getElementById("export").onclick=exportDB;document.getElementById("restore").onclick=importDB;document.getElementById("saveHours").onclick=function(){db.settings.hours=Number(document.getElementById("hours").value)||8;save();render();};
}
function exportDB(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="ssc-cgl-2027-backup-"+today()+".json";a.click();}
function importDB(){var f=document.getElementById("import").files[0];if(!f)return alert("Select a backup file.");var r=new FileReader();r.onload=function(){try{db=JSON.parse(r.result);save();render();alert("Backup restored.");}catch(e){alert("Invalid backup file.");}};r.readAsText(f);}
render();
</script></body></html>
