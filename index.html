<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSC CGL Tracker 2027</title>
<style>body{margin:0;background:#0b1220;color:#eef2ff;font:15px Arial}*{box-sizing:border-box}.app{display:flex;min-height:100vh}aside{width:220px;background:#111a2d;padding:18px}.brand{font-size:21px;font-weight:800;margin:6px}.brand span{color:#8ba5ff}nav button{width:100%;padding:10px;margin:3px 0;background:transparent;border:0;color:#aeb9d3;text-align:left;border-radius:8px}nav button.active,nav button:hover{background:#233455;color:white}main{flex:1;padding:24px;max-width:1400px;margin:auto}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.3fr 1fr}.card{background:#121f35;border:1px solid #2b3d60;border-radius:13px;padding:16px}.big{font-size:28px;font-weight:800}.muted{color:#95a6c5}.bar{height:8px;background:#263650;border-radius:9px}.bar i{display:block;height:100%;background:#8ba5ff;border-radius:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #243653}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #243653;text-align:left}th{color:#95a6c5}select,input{background:#0b1628;color:white;border:1px solid #344a70;padding:8px;border-radius:8px;width:100%}.btn{background:#8ba5ff;color:#08101d;border:0;padding:9px 13px;border-radius:8px;font-weight:700}.badge{padding:4px 7px;border-radius:99px;background:#203252;font-size:12px}.good{color:#6fe0a4}.warn{color:#ffd36e}.bad{color:#ff8797}.heat{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}.day{aspect-ratio:1;background:#17243a;border-radius:3px}.l1{background:#39547d}.l2{background:#5775aa}.l3{background:#7694d7}.l4{background:#a5bdff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal{min-height:70px;border:1px solid #2a3d60;border-radius:8px;padding:6px}.event{font-size:10px;padding:4px;margin-top:4px;background:#233757;border-radius:4px}.event.m{background:#4a3d20}.event.o{background:#482431}@media(max-width:850px){.app{display:block}aside{width:auto}nav{display:grid;grid-template-columns:repeat(2,1fr)}.cards,.two{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}main{padding:14px}}</style></head>
<body><div class="app"><aside><div class="brand">SSC CGL <span>2027</span></div><nav id="nav"></nav></aside><main><div id="page"></div></main></div>
<script>
const S={Quant:["Number System","Percentage","Ratio & Proportion","Average","Profit & Loss","Simple & Compound Interest","Time & Work","Time, Speed & Distance","Algebra","Geometry","Mensuration","Trigonometry","Data Interpretation"],English:["Noun","Pronoun","Verb","Adjective","Adverb","Articles","Prepositions","Tenses","Voice","Narration","Error Detection","Synonyms & Antonyms","One Word Substitution","Idioms & Phrases","Cloze Test","Reading Comprehension"],Reasoning:["Analogy","Classification","Series","Coding-Decoding","Blood Relations","Direction Sense","Venn Diagrams","Syllogism","Statement & Conclusion","Ranking","Non-Verbal Reasoning","Mirror & Water Image","Paper Folding","Embedded Figures"],GA:["Ancient History","Medieval History","Modern History","Indian Polity","Geography","Economics","General Science","Physics","Chemistry","Biology","Static GK","Current Affairs"]};
function make(){return Object.keys(S).flatMap(function(s){return S[s].map(function(t){return{id:s+"|"+t,s:s,topic:t,status:"Not started",studied:null,weekly:null,monthly:null,wd:false,md:false,acc:null}})})}
let db=JSON.parse(localStorage.cgl2027||"null")||{topics:make(),study:[],mocks:[],settings:{hours:8}};
function save(){localStorage.cgl2027=JSON.stringify(db)}function now(){return new Date().toISOString().slice(0,10)}function add(s,n){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function nextSun(s){let d=new Date(s+"T12:00:00"),n=(7-d.getDay())%7||7;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function esc(x){return String(x||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function doneCount(){return db.topics.filter(function(x){return x.status==="Completed"}).length}function ready(){let total=db.topics.length,l=doneCount()/total,aa=db.topics.filter(function(x){return x.acc!=null}),a=aa.length?aa.reduce(function(s,x){return s+Number(x.acc)},0)/aa.length/100:0,h=Math.min(db.study.reduce(function(s,x){return s+Number(x.m||0)},0)/30000,1),c=Math.min(db.study.filter(function(x){return Number(x.m||0)>=60}).length/90,1),m=Math.min(db.mocks.length/30,1);return Math.round(l*35+h*15+a*25+m*15+c*10)}
function revisions(){let t=now(),a=[];db.topics.forEach(function(x){if(x.weekly&&!x.wd)a.push({x:x,type:"Weekly",d:x.weekly,over:x.weekly<=t});if(x.monthly&&!x.md)a.push({x:x,type:"Monthly",d:x.monthly,over:x.monthly<=t})});return a.sort(function(a,b){return a.d.localeCompare(b.d)})}
const labels={dashboard:"🏠 Dashboard",planner:"🗓️ Planner",syllabus:"📚 Syllabus",study:"⏱️ Study Log",revision:"🔁 Revision",pyq:"📝 PYQ",mocks:"🎯 Mocks",analytics:"📊 Analytics",backup:"💾 Backup"};nav.innerHTML=Object.keys(labels).map(function(p){return'<button data-p="'+p+'">'+labels[p]+"</button>"}).join("");nav.onclick=function(e){if(e.target.dataset.p)location.hash=e.target.dataset.p};window.onhashchange=render;
function render(){let p=location.hash.slice(1)||"dashboard";document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("active",b.dataset.p===p)});({dashboard:dashboard,planner:planner,syllabus:syllabus,study:study,revision:revision,pyq:pyq,mocks:mocks,analytics:analytics,backup:backup}[p]||dashboard)(page)}
function dashboard(p){let r=revisions(),w=db.topics.filter(function(x){return x.acc!=null&&x.acc<70}).sort(function(a,b){return a.acc-b.acc}).slice(0,5);p.innerHTML='<h1>SSC CGL Tracker</h1><p class=muted>8 hours/day • Sunday weekly revision • full mocks after 50%</p><div class="grid cards"><div class=card><div class=muted>READINESS</div><div class=big>'+ready()+"%</div><div class=bar><i style='width:"+ready()+"%'></i></div></div><div class=card><div class=muted>SYLLABUS</div><div class=big>"+Math.round(doneCount()/db.topics.length*100)+"%</div></div><div class=card><div class=muted>STUDY</div><div class=big>"+Math.round(db.study.reduce(function(s,x){return s+Number(x.m||0)},0)/60)+"h</div></div><div class=card><div class=muted>REVISION</div><div class=big>"+r.length+"</div><div class=muted>"+r.filter(function(x){return x.over}).length+" overdue</div></div></div><div class="grid two" style="margin-top:14px"><div class=card><h2>⚠️ Weak Topics</h2>"+(w.length?'<table><tr><th>Subject</th><th>Topic</th><th>Accuracy</th></tr>'+w.map(function(x){return'<tr><td>'+x.s+"</td><td>"+esc(x.topic)+"</td><td class=bad>"+x.acc+"%</td></tr>"}).join("")+"</table>":"<div class=muted>Log PYQ accuracy to see weak chapters.</div>")+"</div><div class=card><h2>🔁 Next Revision</h2>"+(r.slice(0,7).map(function(x){return'<div class=row><span>'+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.type+"</span></div>"}).join("")||"<div class=good>Queue clear.</div>")+"</div></div><div class=card style='margin-top:14px'><h2>🔥 Consistency</h2><div class=heat>"+heat()+"</div></div>"}
function heat(){let o="";for(let i=139;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i),s=d.toISOString().slice(0,10),m=db.study.filter(function(x){return x.d===s}).reduce(function(a,x){return a+Number(x.m||0)},0),l=m>=480?4:m>=240?3:m>=60?2:m?1:0;o+='<div class="day l'+l+'" title="'+s+": "+m+' min"></div>'}return o}
function planner(p){let r=revisions().filter(function(x){return x.d<=now()}),sunday=new Date().getDay()===0,half=doneCount()/db.topics.length>=.5;p.innerHTML='<h1>Daily Planner</h1><p class=muted>'+(sunday?"🔁 Sunday Revision Day":"📚 Study + Practice Day")+" • "+db.settings.hours+" hour target</p><div class='grid two'><div class=card><h2>Priority</h2><p>1. Overdue revision</p><p>2. Today’s weekly/monthly revision</p><p>3. Weak chapters (&lt;70%)</p><p>4. New syllabus</p><p>"+(half?'<span class=good>🎯 Full mocks unlocked.</span>':'<span class=warn>🔒 Full mocks unlock at 50%.</span>')+"</p></div><div class=card><h2>Quick Log</h2><form onsubmit=log(event)><select name=s>"+Object.keys(S).map(function(x){return'<option>'+x+"</option>"}).join("")+'</select><input name=m type=number min=1 placeholder="Minutes" required style="margin-top:7px"><input name=t placeholder="Topic" style="margin-top:7px"><button class=btn style="margin-top:7px">Log Study</button></form></div></div><div class=card style="margin-top:14px"><h2>Due / Overdue</h2>'+(r.map(function(x){return'<div class=row><span>'+x.x.s+" • "+esc(x.x.topic)+' <span class=badge>'+x.type+"</span></span><button class=btn onclick="finishRev('"+x.x.id+"','"+x.type+"')">Done</button></div>"}).join("")||"<div class=good>Nothing due.</div>")+"</div>"}
function syllabus(p){p.innerHTML='<h1>Syllabus</h1><p class=muted>Complete a topic → weekly review on the next Sunday + monthly review 30 days later.</p><div class=card><table><tr><th>Subject</th><th>Topic</th><th>Status</th><th>Weekly</th><th>Monthly</th><th>PYQ</th></tr>'+db.topics.map(function(x,i){return'<tr><td>'+x.s+"</td><td>"+esc(x.topic)+'</td><td><select onchange="setTopic('+i+',this.value)"><option '+(x.status==="Not started"?"selected":"")+'>Not started</option><option '+(x.status==="Learning"?"selected":"")+'>Learning</option><option '+(x.status==="Completed"?"selected":"")+'>Completed</option></select></td><td>'+(x.wd?"✅ ":"")+(x.weekly||"—")+"</td><td>"+(x.md?"✅ ":"")+(x.monthly||"—")+"</td><td>"+(x.acc==null?"—":x.acc+"%")+"</td></tr>"}).join("")+"</table></div>"}
function setTopic(i,v){let x=db.topics[i],old=x.status;x.status=v;if(v==="Completed"&&old!=="Completed"){x.studied=now();x.weekly=nextSun(x.studied);x.monthly=add(x.studied,30);x.wd=false;x.md=false}save();render()}
function study(p){p.innerHTML='<h1>Study Log</h1><div class=card><form onsubmit=log(event)><input name=d type=date value='+now()+' required><select name=s>'+Object.keys(S).map(function(x){return'<option>'+x+"</option>"}).join("")+'</select><input name=m type=number min=1 placeholder="Minutes" required><input name=t placeholder="Topic"><button class=btn>Add</button></form></div><div class=card style="margin-top:14px"><table><tr><th>Date</th><th>Subject</th><th>Topic</th><th>Minutes</th></tr>'+db.study.slice().reverse().map(function(x){return'<tr><td>'+x.d+"</td><td>"+x.s+"</td><td>"+esc(x.t)+"</td><td>"+x.m+"</td></tr>"}).join("")+"</table></div>"}
function log(e){e.preventDefault();db.study.push(Object.fromEntries(new FormData(e.target)));save();render()}
function revision(p){let r=revisions();p.innerHTML='<h1>Revision Center</h1><p class=muted>Weekly revision is on Sundays. Overdue items never disappear until completed.</p><div class="grid two"><div class=card><h2>🔁 Weekly</h2>'+r.filter(function(x){return x.type==="Weekly"}).map(function(x){return'<div class=row><span>'+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.d+"</span></div>"}).join("")+'</div><div class=card><h2>📅 Monthly</h2>'+r.filter(function(x){return x.type==="Monthly"}).map(function(x){return'<div class=row><span>'+x.x.s+" • "+esc(x.x.topic)+"</span><span class="+(x.over?"bad":"warn")+">"+x.d+"</span></div>"}).join("")+'</div></div><div class=card style="margin-top:14px"><h2>This Month</h2><div class=calendar>'+cal()+"</div></div>"}
function cal(){let d=new Date(),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),o="";for(let i=0;i<new Date(y,m,1).getDay();i++)o+="<div class=cal></div>";for(let k=1;k<=n;k++){let s=new Date(y,m,k,12).toISOString().slice(0,10),e=revisions().filter(function(x){return x.d===s});o+='<div class=cal><small>'+k+"</small>"+e.map(function(x){return'<div class="event '+(x.type==="Monthly"?"m ":"")+(x.over?"o":"")+'">'+x.type+" • "+esc(x.x.topic)+"</div>"}).join("")+"</div>"}return o}
function finishRev(id,t){let x=db.topics.find(function(a){return a.id===id});if(t==="Weekly")x.wd=true;else x.md=true;save();render()}
function pyq(p){p.innerHTML='<h1>PYQ Tracker</h1><div class=card><form onsubmit=addPYQ(event)><select name=s>'+Object.keys(S).map(function(x){return'<option>'+x+"</option>"}).join("")+'</select><select name=t style="margin-top:7px">'+Object.values(S).flat().map(function(x){return'<option>'+esc(x)+"</option>"}).join("")+'</select><input name=a type=number min=0 max=100 placeholder="Accuracy %" required style="margin-top:7px"><button class=btn style="margin-top:7px">Save</button></form></div><div class=card style="margin-top:14px"><table><tr><th>Subject</th><th>Topic</th><th>Accuracy</th></tr>'+db.topics.filter(function(x){return x.acc!=null}).sort(function(a,b){return a.acc-b.acc}).map(function(x){return'<tr><td>'+x.s+"</td><td>"+esc(x.topic)+"</td><td class="+(x.acc<70?"bad":x.acc<85?"warn":"good")+">"+x.acc+"%</td></tr>"}).join("")+"</table></div>"}
function addPYQ(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),x=db.topics.find(function(a){return a.s===f.s&&a.topic===f.t});if(x)x.acc=Number(f.a);save();render()}
function mocks(p){let ok=doneCount()/db.topics.length>=.5;p.innerHTML='<h1>Mock Tests</h1><div class=badge>'+(ok?"🎯 50% reached — unlocked":"🔒 Locked until 50% syllabus completion")+"</div>"+(ok?'<div class=card style="margin-top:12px"><form onsubmit=addMock(event)><input name=d type=date value='+now()+'><input name=n placeholder="Mock name" required><input name=s type=number placeholder="Score" required><input name=t type=number value=200><button class=btn>Add Mock</button></form></div>':'')+'<div class=card style="margin-top:12px"><table><tr><th>Date</th><th>Mock</th><th>Score</th><th>%</th></tr>'+db.mocks.slice().reverse().map(function(x){return'<tr><td>'+x.d+"</td><td>"+esc(x.n)+"</td><td>"+x.s+"/"+x.t+"</td><td>"+Math.round(x.s/x.t*100)+"%</td></tr>"}).join("")+"</table></div>"}
function addMock(e){e.preventDefault();db.mocks.push(Object.fromEntries(new FormData(e.target)));save();render()}
function analytics(p){p.innerHTML='<h1>Analytics</h1><div class="grid cards">'+Object.keys(S).map(function(s){let a=db.topics.filter(function(x){return x.s===s&&x.acc!=null}).map(function(x){return x.acc}),v=a.length?Math.round(a.reduce(function(u,z){return u+z},0)/a.length):0;return'<div class=card><div class=muted>'+s+'</div><div class=big>'+(v||"—")+(v?"%":"")+'</div><div class=bar><i style="width:'+v+'%"></i></div></div>'}).join("")+'</div><div class=card style="margin-top:14px"><p>🔴 Weak &lt;70% • 🟡 Needs work 70–84% • 🟢 Strong 85%+</p><p>🎯 Full mocks begin after 50% syllabus completion.</p></div>'}
function backup(p){p.innerHTML='<h1>Backup & Settings</h1><div class=card><p class=muted>No paid cloud database. Data stays in this browser.</p><button class=btn onclick=exportDB()>Export JSON Backup</button><input id=f type=file accept=.json style="margin-top:10px"><button class=btn onclick=importDB() style="margin-top:10px">Import Backup</button><div style="margin-top:15px"><label>Daily target hours <input id=h type=number min=1 max=24 value='+db.settings.hours+'></label><button class=btn onclick=setH() style="margin-top:8px">Save</button></div></div>'}
function exportDB(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="ssc-cgl-2027-backup-"+now()+".json";a.click()}
function importDB(){let f=document.getElementById("f").files[0];if(!f)return alert("Select a backup.");let r=new FileReader();r.onload=function(){try{db=JSON.parse(r.result);save();render();alert("Restored.")}catch(e){alert("Invalid backup.")}};r.readAsText(f)}
function setH(){db.settings.hours=Number(document.getElementById("h").value)||8;save();render()}
render();
</script></body></html>
