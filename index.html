</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="app"><aside><div class="brand">SSC CGL <span>2027</span></div><nav id="nav"></nav></aside><main><div id="page"></div></main></div>
<script>
const S = {
  Quant: ["Number System","Percentage","Ratio & Proportion","Average","Profit & Loss","Simple & Compound Interest","Time & Work","Time, Speed & Distance","Algebra","Geometry","Mensuration","Trigonometry","Data Interpretation"],
  English: ["Noun","Pronoun","Verb","Adjective","Adverb","Articles","Prepositions","Tenses","Voice","Narration","Error Detection","Synonyms & Antonyms","One Word Substitution","Idioms & Phrases","Cloze Test","Reading Comprehension"],
  Reasoning: ["Analogy","Classification","Series","Coding-Decoding","Blood Relations","Direction Sense","Venn Diagrams","Syllogism","Statement & Conclusion","Ranking","Non-Verbal Reasoning","Mirror & Water Image","Paper Folding","Embedded Figures"],
  GA: ["Ancient History","Medieval History","Modern History","Indian Polity","Geography","Economics","General Science","Physics","Chemistry","Biology","Static GK","Current Affairs"]
};
function makeTopics(){return Object.keys(S).flatMap(function(s){return S[s].map(function(topic){return {id:s+"|"+topic,s:s,topic:topic,status:"Not started",studied:null,weekly:null,monthly:null,weeklyDone:false,monthlyDone:false,acc:null};});});}
let db;
try{db=JSON.parse(localStorage.getItem("cgl2027")||"null");}catch(e){db=null;}
if(!db || !Array.isArray(db.topics)){db={topics:makeTopics(),study:[],mocks:[],settings:{hours:8}};}
if(!db.study)db.study=[]; if(!db.mocks)db.mocks=[]; if(!db.settings)db.settings={hours:8};

var CLOUD_CONFIG_KEY="cgl2027_cloud_config",CLOUD_META_KEY="cgl2027_cloud_meta";
var cloudClient=null,cloudSession=null,cloudAutoSync=false,cloudSyncTimer=null,cloudPollTimer=null,cloudApplying=false,cloudSyncBusy=false;

function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||"null")||{};}catch(e){return {};}}
function cloudMeta(){try{return JSON.parse(localStorage.getItem(CLOUD_META_KEY)||"null")||{};}catch(e){return {};}}
function setCloudMeta(m){localStorage.setItem(CLOUD_META_KEY,JSON.stringify(m||{}));}
function cloudSessionUser(){return cloudSession&&cloudSession.user?cloudSession.user:null;}
function cloudReady(){return !!(cloudClient&&cloudSessionUser());}
function saveCloudConfig(url,key){localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url:String(url||"").trim().replace(/\/$/,""),key:String(key||"").trim()}));}
function ensureCloudClient(){
  if(!window.supabase||!window.supabase.createClient)throw new Error("Supabase library could not load. Check your internet connection and refresh.");
  var cfg=cloudConfig();
  if(!cfg.url||!cfg.key)throw new Error("Enter your Supabase Project URL and publishable/anon key first.");
  if(!/^https:\/\/[A-Za-z0-9.-]+\.supabase\.co(?:\/)?$/.test(cfg.url))throw new Error("Project URL should look like https://your-project.supabase.co");
  if(!cloudClient||cloudClient.__cglUrl!==cfg.url||cloudClient.__cglKey!==cfg.key){
    cloudClient=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    cloudClient.__cglUrl=cfg.url;cloudClient.__cglKey=cfg.key;
  }
  return cloudClient;
}
async function refreshCloudSession(){
  try{
    var c=ensureCloudClient(),res=await c.auth.getSession();
    if(res.error)throw res.error;
    cloudSession=res.data.session||null;
    if(cloudSessionUser()){
      var m=cloudMeta();
      cloudAutoSync=!!m.autoSync;
      if(cloudAutoSync)startCloudPolling();
    }
    return cloudSession;
  }catch(e){
    cloudSession=null;cloudAutoSync=false;stopCloudPolling();
    return null;
  }
}
function stopCloudPolling(){if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null;}}
function startCloudPolling(){
  stopCloudPolling();
  cloudPollTimer=setInterval(function(){cloudPollRemote().catch(function(e){cloudSetStatus("Cloud check failed: "+e.message,"bad");});},30000);
}
function cloudSetStatus(msg,cls){
  var el=document.getElementById("cloudStatus");
  if(el)el.innerHTML="<span class='"+(cls||"muted")+"'>"+esc(msg)+"</span>";
  var badge=document.getElementById("cloudStateBadge");
  if(badge)badge.textContent=msg;
}
function cloudSetAccountStatus(){
  var el=document.getElementById("cloudAccountStatus");
  if(!el)return;
  var u=cloudSessionUser(),m=cloudMeta();
  if(u)el.innerHTML="<b>Signed in:</b> "+esc(u.email||"Account")+" • "+(cloudAutoSync?"🔄 Auto-sync ON":"⏸️ Auto-sync waiting for initial sync");
  else el.innerHTML="<span class='muted'>Not signed in. Local browser storage is still active.</span>";
  var email=document.getElementById("cloudEmail");if(email&&u&&!email.value)email.value=u.email||"";
  var auto=document.getElementById("cloudAutoBadge");if(auto)auto.textContent=cloudAutoSync?"AUTO-SYNC ON":"AUTO-SYNC OFF";
}
function cloudPayload(){
  var copy=JSON.parse(JSON.stringify(db));
  delete copy.cloud;
  delete copy._cloud;
  return copy;
}
function markCloudLinked(remoteMs){
  var m=cloudMeta();
  m.autoSync=true;m.lastRemoteUpdatedAt=remoteMs||Date.now();m.lastSyncedAt=Date.now();m.localDirty=false;
  setCloudMeta(m);cloudAutoSync=true;startCloudPolling();cloudSetAccountStatus();
}
async function cloudFetchRow(){
  var c=ensureCloudClient();if(!cloudSessionUser())await refreshCloudSession();
  if(!cloudSessionUser())throw new Error("Please sign in first.");
  var res=await c.from("cgl_tracker_data").select("data,updated_at").eq("user_id",cloudSessionUser().id).maybeSingle();
  if(res.error)throw res.error;
  return res.data||null;
}
async function cloudUpload(){
  if(!cloudSessionUser())await refreshCloudSession();
  if(!cloudSessionUser())throw new Error("Please sign in first.");
  var c=ensureCloudClient();
  var now=new Date().toISOString();
  var res=await c.from("cgl_tracker_data").upsert({user_id:cloudSessionUser().id,data:cloudPayload(),updated_at:now},{onConflict:"user_id"});
  if(res.error)throw res.error;
  markCloudLinked(Date.parse(now)||Date.now());
  cloudSetStatus("✅ Uploaded this device to cloud. Future changes will auto-sync.","good");
}
async function cloudDownload(){
  var row=await cloudFetchRow();
  if(!row)throw new Error("Your cloud account has no tracker data yet. Use “Upload this device” on the device that already has your data.");
  if(!confirm("Download cloud data to this device? This replaces the current local tracker data. A safety snapshot will be kept in this browser."))return;
  localStorage.setItem("cgl2027_cloud_pre_pull_backup",JSON.stringify(db));
  cloudApplying=true;
  try{
    db=row.data;
    if(!db||!Array.isArray(db.topics))throw new Error("Cloud data is not a valid SSC CGL Tracker backup.");
    normalizeDb();save();
  }finally{cloudApplying=false;}
  markCloudLinked(Date.parse(row.updated_at)||Date.now());
  render();
  cloudSetStatus("✅ Cloud data downloaded to this device. Auto-sync is ON.","good");
}
async function cloudPollRemote(){
  if(!cloudAutoSync||!cloudSessionUser()||cloudSyncBusy)return;
  var row=await cloudFetchRow();if(!row)return;
  var remoteMs=Date.parse(row.updated_at)||0,m=cloudMeta(),known=Number(m.lastRemoteUpdatedAt||0);
  if(remoteMs<=known)return;
  if(m.localDirty){
    cloudSetStatus("⚠️ Cloud has newer data while this device also has local changes. Press Sync Now to choose.","warn");
    return;
  }
  cloudApplying=true;
  try{
    db=row.data;normalizeDb();save();
  }finally{cloudApplying=false;}
  m=cloudMeta();m.lastRemoteUpdatedAt=remoteMs;m.lastSyncedAt=Date.now();m.localDirty=false;setCloudMeta(m);
  render();

function revisionStats(){
  db.revisionHistory=db.revisionHistory||[];
  var t=today(),weekStart=new Date(t+"T12:00:00");
  weekStart.setDate(weekStart.getDate()-weekStart.getDay());
  var monthStart=t.slice(0,8)+"01";
  var week=db.revisionHistory.filter(function(x){return x.completedOn>=weekStart.toISOString().slice(0,10);}).length;
  var month=db.revisionHistory.filter(function(x){return x.completedOn>=monthStart;}).length;
  var sundays={};
  db.revisionHistory.filter(function(x){return x.type==="Weekly";}).forEach(function(x){
    var d=new Date(x.completedOn+"T12:00:00");
    var key=new Date(d);key.setDate(d.getDate()-d.getDay());sundays[key.toISOString().slice(0,10)]=true;
  });
  var streak=0,d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay());
  while(sundays[d.toISOString().slice(0,10)]){streak++;d.setDate(d.getDate()-7);if(streak>100)break;}
  return {week:week,month:month,streak:streak};
}

    if(total&&attempted>total)accPreview.innerHTML="<span class='bad'>⚠️ Right + Wrong cannot exceed Total.</span>";
    else accPreview.innerHTML=attempted?"<b>Accuracy:</b> "+a+"%":"Accuracy: —";
  }

  subj.addEventListener("change",function(){
    db.pyqSubject=subj.value;db.pyqTopic={subject:subj.value,topic:(S[subj.value]||[])[0]||""};save();render();
  });
  topic.addEventListener("change",refreshPageForTopic);
  ["total","right","wrong"].forEach(function(n){form[n].addEventListener("input",updatePreview);});

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var f=new FormData(e.target),subject=subj.value,t=topic.value,date=f.get("date")||today(),total=Number(f.get("total")||0),right=Number(f.get("right")||0),wrong=Number(f.get("wrong")||0),attempted=right+wrong;
    if(!total||right<0||wrong<0||attempted>total){
      alert("Please make sure Total is at least 1 and Right + Wrong is not greater than Total.");
      return;
    }
    var x=db.topics.find(function(a){return a.s===subject&&a.topic===t;});
    if(!x)return;
    var unattempted=total-attempted,accuracy=attempted?Math.round(right/attempted*1000)/10:0;
    var id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+"-"+String(Math.floor(Math.random()*100000));
    db.pyqAttempts.push({id:id,topicId:x.id,subject:subject,topic:t,date:date,total:total,right:right,wrong:wrong,unattempted:unattempted,accuracy:accuracy,createdAt:Date.now()});
    x.totalQuestions=total;x.right=right;x.wrong=wrong;x.acc=accuracy;
    db.pyqSubject=subject;db.pyqTopic={subject:subject,topic:t};save();render();
  });

  p.querySelectorAll(".pyq-delete").forEach(function(btn){
    btn.addEventListener("click",function(){
      if(!confirm("Delete this PYQ attempt?"))return;
      var id=btn.dataset.id;
      db.pyqAttempts=db.pyqAttempts.filter(function(a){return a.id!==id;});
      var x=db.topics.find(function(a){return a.id===selected.id;});
      var left=selected?attemptsFor(selected.id):[];
      if(x){
        if(left.length){
          var last=left[left.length-1];x.totalQuestions=last.total;x.right=last.right;x.wrong=last.wrong;x.acc=last.accuracy;
        }else{
          delete x.totalQuestions;delete x.right;delete x.wrong;delete x.acc;
        }
      }
      save();render();
    });
  });

  loadSelectedValues();
}

function analytics(p){
  db.pyqAttempts=db.pyqAttempts||[];
  function pct(n,d){return d?Math.round(n/d*1000)/10:0;}
  function subjectStudy(s){return db.study.filter(function(x){return x.subject===s;});}
  function subjectPyqs(s){return db.pyqAttempts.filter(function(x){return x.subject===s;});}
  function subjectTopics(s){return db.topics.filter(function(x){return x.s===s;});}
  function latestTopicAccuracy(x){
    var a=db.pyqAttempts.filter(function(z){return z.topicId===x.id;}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))||Number(a.createdAt||0)-Number(b.createdAt||0);});
    if(a.length)return Number(a[a.length-1].accuracy||0);
    if(x.acc!=null)return Number(x.acc);
    return null;
  }
  function dayData(days){
    var out=[],d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(days-1));
    for(var i=0;i<days;i++){var s=d.toISOString().slice(0,10),mins=db.study.filter(function(x){return x.date===s;}).reduce(function(a,x){return a+Number(x.minutes||0);},0);out.push({date:s,label:d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}),hours:Math.round(mins/60*10)/10});d.setDate(d.getDate()+1);}
    return out;
  }
  function recentAttemptTrend(){return db.pyqAttempts.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))||Number(a.createdAt||0)-Number(b.createdAt||0);}).slice(-10);}
  var totalStudy=totalMinutes(),studyHours=Math.round(totalStudy/60*10)/10,totalQuestions=db.study.reduce(function(a,x){return a+Number(x.questions||0);},0);
  var pAll=db.pyqAttempts,pyqRight=pAll.reduce(function(a,x){return a+Number(x.right||0);},0),pyqAttempted=pAll.reduce(function(a,x){return a+Number(x.right||0)+Number(x.wrong||0);},0),pyqAcc=pct(pyqRight,pyqAttempted);
  var activeDays=new Set(db.study.filter(function(x){return Number(x.minutes||0)>0;}).map(function(x){return x.date;})).size,avgActive=activeDays?Math.round(studyHours/activeDays*10)/10:0;
  var efficiency=studyHours?Math.round(totalQuestions/studyHours*10)/10:0,weekly=consistencyStats(),weekPct=Math.min(100,Math.round(weekly.weekMinutes/3360*100));
  var readinessPct=readiness(),daily=dayData(14),maxDay=Math.max(8,Math.max.apply(null,daily.map(function(x){return x.hours;}))),trend=recentAttemptTrend();

  var subjectCards=Object.keys(S).map(function(s){
    var st=subjectStudy(s),mins=st.reduce(function(a,x){return a+Number(x.minutes||0);},0),q=st.reduce(function(a,x){return a+Number(x.questions||0);},0);
    var topics=subjectTopics(s),done=topics.filter(function(x){return x.status==="Completed";}).length,progress=pct(done,topics.length);
    var pa=subjectPyqs(s),pr=pa.reduce(function(a,x){return a+Number(x.right||0);},0),pat=pa.reduce(function(a,x){return a+Number(x.right||0)+Number(x.wrong||0);},0),acc=pct(pr,pat);
    return "<div class='card subject-card'><div class='row' style='border-bottom:0'><div><div class='subject-name'>"+esc(s)+"</div><div class='subject-stat'>"+done+"/"+topics.length+" topics completed</div></div><span class='badge'>"+(pa.length?acc+"% PYQ":"No PYQ yet")+"</span></div><div class='subject-progress'><i style='width:"+progress+"%'></i></div><div class='subject-metric'><div><div class='kicker'>STUDY</div><div style='font-weight:850;margin-top:4px'>"+Math.round(mins/60*10)/10+"h</div></div><div><div class='kicker'>QUESTIONS</div><div style='font-weight:850;margin-top:4px'>"+q+"</div></div><div><div class='kicker'>SYLLABUS</div><div style='font-weight:850;margin-top:4px'>"+progress+"%</div></div></div></div>";
  }).join("");

  var weak=db.topics.map(function(x){return {x:x,a:latestTopicAccuracy(x)};}).filter(function(z){return z.a!=null&&z.a<85;}).sort(function(a,b){return a.a-b.a;}).slice(0,7);
  var weakHtml=weak.length?"<table class='analytics-table'><tr><th>#</th><th>Subject</th><th>Topic</th><th>Latest</th><th>Priority</th></tr>"+weak.map(function(z,i){var priority=z.a<70?"Weak":"Needs work";return "<tr><td><span class='rank'>"+(i+1)+"</span></td><td>"+esc(z.x.s)+"</td><td>"+esc(z.x.topic)+"</td><td class='"+(z.a<70?"bad":"warn")+"'><b>"+z.a+"%</b></td><td><span class='trend-pill'>"+priority+"</span></td></tr>";}).join("")+"</table>":"<div class='empty'>No weak PYQ topics yet. Keep building your attempt history.</div>";

  var dailyBars=daily.map(function(x){var h=Math.max(2,Math.round(x.hours/maxDay*100));return "<div class='chart-col'><div class='chart-val'>"+(x.hours||0)+"h</div><div class='chart-bar' style='height:"+h+"%'></div><div class='chart-date'>"+x.label+"</div></div>";}).join("");
  var trendBars=trend.length?trend.map(function(x,i){var h=Math.max(4,Math.round(Number(x.accuracy||0)/100*100));return "<div class='chart-col'><div class='chart-val'>"+Number(x.accuracy||0)+"%</div><div class='chart-bar' style='height:"+h+"%'></div><div class='chart-date'>#"+(i+1)+"</div></div>";}).join(""):"";
  var strongest=Object.keys(S).map(function(s){var pa=subjectPyqs(s),r=pa.reduce(function(a,x){return a+Number(x.right||0);},0),att=pa.reduce(function(a,x){return a+Number(x.right||0)+Number(x.wrong||0);},0);return {s:s,a:pct(r,att),n:pa.length};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.a-a.a;}),topSubject=strongest.length?strongest[0].s:"—";

  p.innerHTML="<div class='topline'><div><h1>Analytics</h1><p class='muted page-sub'>Turn your study, syllabus and PYQ data into a clear picture of what is working and what needs attention.</p></div><div class='topmeta'><span class='badge'>🎯 Readiness "+readinessPct+"%</span><span class='badge'>📈 "+activeDays+" active days</span></div></div>"+
  "<div class='card section analytics-hero'><div class='row' style='border-bottom:0;align-items:flex-start'><div><div class='kicker'>📊 YOUR PREPARATION SNAPSHOT</div><div style='font-size:25px;font-weight:900;margin-top:6px'>Data should tell you what to do next.</div><div class='muted' style='margin-top:5px'>Use this page to spot weak areas, measure consistency and make your next study session smarter.</div></div><div style='text-align:right'><div style='font-size:36px;font-weight:900'>"+readinessPct+"%</div><div class='metric-note'>overall readiness</div></div></div><div class='grid cards' style='margin-top:17px'><div class='card' style='box-shadow:none;background:#0d1a2e'><div class='kicker'>STUDY HOURS</div><div class='big'>"+studyHours+"</div><div class='metric-note'>"+avgActive+"h per active day</div></div><div class='card' style='box-shadow:none;background:#0d1a2e'><div class='kicker'>QUESTIONS SOLVED</div><div class='big'>"+totalQuestions+"</div><div class='metric-note'>"+efficiency+"/hour logged</div></div><div class='card' style='box-shadow:none;background:#0d1a2e'><div class='kicker'>PYQ ACCURACY</div><div class='big'>"+(pAll.length?pyqAcc+"%":"—")+"</div><div class='metric-note'>"+pyqAttempted+" attempted</div></div><div class='card' style='box-shadow:none;background:#0d1a2e'><div class='kicker'>THIS WEEK</div><div class='big'>"+Math.round(weekly.weekMinutes/60*10)/10+"h</div><div class='metric-note'>"+weekPct+"% of 56h goal</div></div></div><div class='subject-progress' style='margin-top:16px;height:10px'><i style='width:"+readinessPct+"%'></i></div></div>"+
  "<div class='card section'><div class='row' style='border-bottom:0'><div><div class='kicker'>📚 SUBJECT PERFORMANCE</div><h2 style='margin:4px 0 0'>Where your preparation stands</h2></div><span class='badge'>Best PYQ subject: "+esc(topSubject)+"</span></div><div class='grid cards'>"+subjectCards+"</div></div>"+
  "<div class='grid two section'><div class='card'><div class='row' style='border-bottom:0'><div><div class='kicker'>⏱️ STUDY RHYTHM</div><h2 style='margin:4px 0 0'>Last 14 days</h2></div><span class='badge'>Target 8h/day</span></div><div class='mini-chart'>"+dailyBars+"</div><div class='muted' style='font-size:12px'>Each bar is your logged study time for that day.</div></div><div class='card'><div class='row' style='border-bottom:0'><div><div class='kicker'>🎯 WEEKLY TARGET</div><h2 style='margin:4px 0 0'>"+weekPct+"% complete</h2></div><span class='badge'>"+Math.round(weekly.weekMinutes/60*10)/10+" / 56h</span></div><div style='font-size:52px;font-weight:900;margin:20px 0 8px'>"+weekly.activeDays+"/7</div><div class='muted'>active days this week</div><div class='bar' style='margin-top:13px'><i style='width:"+weekPct+"%'></i></div><div class='metric-note' style='margin-top:8px'>"+(weekPct>=100?"Weekly target achieved.":"Keep adding study blocks before Sunday.")+"</div></div></div>"+
  "<div class='grid two section'><div class='card'><div class='row' style='border-bottom:0'><div><div class='kicker'>🔴 PRIORITY TOPICS</div><h2 style='margin:4px 0 0'>Weakest PYQ areas</h2></div><span class='badge'>Below 85%</span></div>"+weakHtml+"</div><div class='card'><div class='row' style='border-bottom:0'><div><div class='kicker'>📈 PYQ ACCURACY TREND</div><h2 style='margin:4px 0 0'>Your last "+trend.length+" attempts</h2></div><span class='badge'>Goal 85%+</span></div>"+(trend.length?"<div class='mini-chart'>"+trendBars+"</div><div class='muted' style='font-size:12px'>Attempts shown oldest → newest.</div>":"<div class='empty' style='margin-top:14px'>Save a few PYQ attempts and your improvement curve will appear here.</div>")+"</div></div>"+
  "<div class='card section'><div class='row' style='border-bottom:0'><div><div class='kicker'>🧠 WHAT THE DATA SAYS</div><h2 style='margin:4px 0 0'>Next-step guidance</h2></div><span class='badge'>Auto-generated</span></div><div class='row'><span>📚 Syllabus progress</span><b>"+syllabusPct()+"%</b></div><div class='row'><span>🔁 Revision queue</span><b>"+revisions().length+" topics</b></div><div class='row'><span>📝 PYQ attempts saved</span><b>"+pAll.length+"</b></div><div class='notice' style='margin-top:13px'>"+(weak.length?"<b>Focus recommendation:</b> start with <b>"+esc(weak[0].x.s)+" • "+esc(weak[0].x.topic)+"</b> at "+weak[0].a+"%.":"<b>Focus recommendation:</b> keep logging PYQs so the tracker can identify your weakest topics.")+"</div></div>";
}
